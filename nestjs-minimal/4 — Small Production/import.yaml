# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json

# Small production environment runs multiple containers for zero-downtime deploys
# and basic availability. Suitable for low-to-medium traffic applications.

project:
  name: nestjs-minimal-small-prod

services:
  # Production NestJS with 2 containers — Zerops performs rolling deploys:
  # new containers start and pass readiness checks before old ones are removed.
  # minFreeRamGB: 0.125 reserves ~50% of minRam for V8 garbage collection
  # spikes and incoming traffic bursts.
  - hostname: app
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/krls2020/nestjs-minimal-app
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.125

  # Single-node PostgreSQL — still NON_HA to keep costs manageable.
  # For data durability, upgrade to HA mode (see highly-available-production).
  # Zerops handles automated backups regardless of HA mode.
  - hostname: db
    type: postgresql@16
    mode: NON_HA
    priority: 10
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25
